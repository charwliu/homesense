[package]
name = "homesensed"
default-run = "homesensed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2 = "=0.11.0"
subtle = "=2.6.1"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
homesense-import = { path = "../homesense-import" }
homesense-core.workspace = true
homesense-config.workspace = true
homesense-storage.workspace = true
homesense-hap.workspace = true
uuid.workspace = true
hap.workspace = true
tokio.workspace = true
hb-protocol.workspace = true
hb-transport.workspace = true
homesense-state.workspace = true
homesense-simulator.workspace = true

env_logger = "=0.11.10"
log = "=0.4.34"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rusqlite.workspace = true
chacha20poly1305 = "=0.11.0"
ed25519-dalek = "=3.0.0"
hkdf = "=0.13.0"
rand = "=0.10.3"
sha2 = "=0.11.0"
x25519-dalek = "=3.0.0"

# Test-only controller SRP digest adapter; same pinned versions as HAP tests.
srp = "=0.6.0"
sha2_srp = { package = "sha2", version = "=0.10.9" }
