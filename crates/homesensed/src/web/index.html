<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HomeSense 管理</title><link rel="stylesheet" href="/style.css"><body><main><h1>HomeSense</h1><p>设备与场景管理 · 接受请求不代表设备已到达目标状态。</p><label>访问令牌 <input id="token" type="password" autocomplete="off"></label><button id="connect">连接</button><button id="logout">退出</button><p id="status" role="status"></p><button id="refresh">刷新状态</button><section id="devices" aria-label="设备"></section><section id="scenes" aria-label="场景"></section><section id="configuration" hidden aria-label="配置草稿"><h2>运行诊断</h2><button id="runtime-status">读取运行状态</button><pre id="runtime-result" aria-live="polite"></pre><h2>日历调度诊断</h2><button id="calendar-status">读取调度状态</button><p>水位用于防重放，不代表场景或设备动作成功。</p><pre id="calendar-result" aria-live="polite"></pre><h2>配置历史</h2><button id="load-versions">读取版本</button><button id="more-versions" disabled>下一页</button><p>导出保存到本机，不激活历史版本。</p><div id="versions"></div><h2>配置草稿</h2><button id="list-drafts">浏览我的草稿</button><div id="draft-list"></div><p>保存只验证和存储草稿，不改变当前运行配置。</p><label>预期活动版本 <input id="base-revision" type="text" inputmode="numeric" pattern="[0-9]+"></label><label>新版本 <input id="draft-revision" type="text" inputmode="numeric" pattern="[0-9]+"></label><label>设备 JSON <textarea id="device-document" rows="8" cols="60"></textarea></label><label>自动化 JSON <textarea id="automation-document" rows="8" cols="60"></textarea></label><button id="save-draft">验证并保存新草稿</button><label>草稿 ID <input id="draft-id" type="text"></label><button id="load-draft">读取草稿</button><button id="preview-draft">预览发布影响</button><button id="activate-draft" disabled>激活已预览草稿</button><pre id="draft-impact" aria-live="polite"></pre></section></main><script src="/draft-json.js"></script><script src="/app.js"></script></body></html>
