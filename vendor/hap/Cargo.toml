[package]
name = "hap"
version = "0.1.0-pre.15"
authors = ["Elias Wilken <elias@wlkn.io>"]
edition = "2021"
description = "Rust implementation of the Apple HomeKit Accessory Protocol (HAP)"
documentation = "https://docs.rs/hap"
readme = "README.md"
repository = "https://github.com/ewilken/hap-rs"
license = "MIT OR Apache-2.0"
publish = false
keywords = ["apple", "homekit"]
exclude = [
    ".github",
    ".gitignore",
    "examples",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "rls.toml",
    "rustfmt.toml",
]

[dependencies]
aead = "0.4"
async-trait = "0.1"
byteorder = "1.3"
bytes = "1.0"
chacha20poly1305 = "0.8"
ed25519-dalek = { version = "=2.2.0", features = ["std", "serde", "rand_core"] }
curve25519-dalek = "=4.1.3"
erased-serde = "0.3"
macaddr = { version = "1.0.1", features = ["serde"] }
futures = "0.3"
get_if_addrs = { package = "if-addrs", version = "0.6" }
hkdf = "0.11"
hyper = { version = "0.14", features = ["server", "http1"] }
libmdns = "0.6"
log = "0.4"
num = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["rc", "derive"] }
serde_json = "1.0"
sha2 = "0.9"
signature = "2.2"
srp = "0.5"
thiserror = "1.0"
tokio = { version = "1.8", features = ["time", "io-util", "sync"] }
url = "2.1"
uuid = { version = "0.8", features = ["v4", "serde"] }
x25519-dalek = "=2.0.1"
