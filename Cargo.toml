[workspace]
members = ["crates/homesense-core", "crates/hb-protocol", "crates/hb-transport", "crates/homesense-state", "crates/homesense-simulator", "crates/homesensed", "crates/homesense-storage", "crates/homesense-config", "crates/homesense-hap", "crates/homesense-import"]
resolver = "2"
exclude = ["vendor/hap"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
homesense-core = { path = "crates/homesense-core" }
hb-protocol = { path = "crates/hb-protocol" }
hb-transport = { path = "crates/hb-transport" }
homesense-state = { path = "crates/homesense-state" }
homesense-simulator = { path = "crates/homesense-simulator" }

homesense-storage = { path = "crates/homesense-storage" }
rusqlite = { version = "=0.40.0", features = ["bundled"] }

homesense-config = { path = "crates/homesense-config" }
homesense-hap = { path = "crates/homesense-hap" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

hap = { path = "vendor/hap" }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = "=0.1.92"
uuid = { version = "=0.8.2", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
